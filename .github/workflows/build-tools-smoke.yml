name: Smoke test build tools
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-port:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/smoke-build-tools.js
  compile-mac-port:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Enable Intel execution on the Apple Silicon CI runner
        run: |
          if [[ "$(sysctl -n hw.optional.arm64)" == 1 ]]; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Verify Finder tool detection and compile Sunshine without a ROM
        run: node scripts/smoke-mac-tools.js
