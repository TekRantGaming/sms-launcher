name: Smoke test build tools
on:
  pull_request:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  compile-port:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/smoke-build-tools.js
  compile-mac-port:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Enable Intel execution on the Apple Silicon CI runner
        run: |
          if [[ "$(sysctl -n hw.optional.arm64)" == 1 ]]; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Verify Finder tool detection and compile Sunshine without a ROM
        run: node scripts/smoke-mac-tools.js
  # Informational until Eclipse builds everywhere: a failure here never fails the run or blocks a release.
  compile-eclipse:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Enable Intel execution on the Apple Silicon CI runner
        if: runner.os == 'macOS'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Compile Eclipse without a ROM
        run: node scripts/smoke-eclipse.js
