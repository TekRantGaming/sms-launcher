name: Publish build tool archives
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: win32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Prepare tool archives and corresponding sources
        run: node scripts/package-build-tools.js
      - name: Compile with the relocated archive
        run: node scripts/smoke-build-tools.js
        env:
          SMS_TOOL_ASSET_MANIFEST: tool-assets/manifest-${{ matrix.platform }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: tools-${{ matrix.platform }}
          path: tool-assets/*
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: prepare-tools
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: tool-assets
          merge-multiple: true
      - name: Publish immutable toolset release
        run: node scripts/publish-tool-assets.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
