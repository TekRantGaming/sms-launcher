name: Publish build tool archives
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Tool archive to publish
        type: choice
        default: all
        options: [all, linux, win32]
      reuse_run:
        description: Optional previous run containing prepared tool archives to reverify
        type: string
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  prepare-tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: win32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        if: (inputs.platform == 'all' || inputs.platform == matrix.platform)
      - uses: actions/setup-node@v4
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
      - name: Prepare tool archives and corresponding sources
        if: (inputs.platform == 'all' || inputs.platform == matrix.platform) && inputs.reuse_run == ''
        run: node scripts/package-build-tools.js
      - name: Reuse prepared archives
        if: (inputs.platform == 'all' || inputs.platform == matrix.platform) && inputs.reuse_run != ''
        uses: actions/download-artifact@v4
        with:
          name: tools-${{ matrix.platform }}
          path: tool-assets
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile with the relocated archive
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        run: node scripts/smoke-build-tools.js
        env:
          SMS_TOOL_ASSET_MANIFEST: tool-assets/manifest-${{ matrix.platform }}.json
      - uses: actions/upload-artifact@v4
        # Retain prepared archives for diagnosis/reverification if smoke fails.
        # The publish job still requires successful preparation and smoke.
        if: always() && (inputs.platform == 'all' || inputs.platform == matrix.platform)
        with:
          name: tools-${{ matrix.platform }}
          path: tool-assets/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: prepare-tools
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: tool-assets
          merge-multiple: true
      - name: Publish immutable toolset release
        run: node scripts/publish-tool-assets.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
